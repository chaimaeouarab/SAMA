name: sama
description: "SAMA - decision support for farmers based on 40 years of NASA POWER rainfall."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  just_audio: ^0.10.6
  geolocator: ^14.0.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  fl_chart: ^1.3.1
  flutter_svg: ^2.4.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/crops/
    - assets/images/illustrations/
    - assets/images/brand/
    - assets/audio/darija/male/
    - assets/audio/ar/male/
    - assets/audio/en/male/
    - assets/audio/fr/male/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/brand/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/brand/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/images/brand/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#0C5A3B"
